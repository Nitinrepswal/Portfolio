<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Nitin Repswal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #121212;
            color: #ffffff;
            font-family: 'Inter', -apple-system, sans-serif;
            text-align: center;
        }
        
        .error-container {
            max-width: 400px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        h1 {
            font-size: 64px;
            margin: 0 0 16px 0;
            color: #ff5f56;
        }
        
        p {
            font-size: 16px;
            opacity: 0.7;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        
        a {
            display: inline-block;
            background: #0058d0;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 500;
            transition: background 0.2s;
        }
        
        a:hover {
            background: #004bb5;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <p>This desktop doesn't exist.<br>You may have taken a wrong turn in the filesystem.</p>
        <a href="/">Return to Desktop</a>
    </div>
</body>
</html>
